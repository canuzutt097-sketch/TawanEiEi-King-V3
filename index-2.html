<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TawanEiEi King V3👑</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(circle at 72% 35%,rgba(21,151,255,.20),transparent 30%),
    linear-gradient(135deg,#05080c,#101822 55%,#06111c);
  color:#fff;
  font-family:Arial,"Noto Sans Thai",sans-serif;
  overflow:hidden;
}
body::before{
  content:"FREE FIRE MAX";
  position:fixed;
  right:5vw;
  top:4vh;
  color:rgba(255,255,255,.08);
  font-size:clamp(28px,6vw,80px);
  font-weight:900;
  font-style:italic;
  letter-spacing:2px;
}
.panel{
  position:fixed;
  left:4vw;
  top:50%;
  transform:translateY(-50%);
  width:min(430px,88vw);
  max-height:92vh;
  overflow:auto;
  background:rgba(9,13,18,.96);
  border:2px solid #1597ff;
  border-radius:16px;
  padding:24px 22px 25px;
  box-shadow:0 0 30px rgba(21,151,255,.32);
}
.title{
  text-align:center;
  color:#1597ff;
  font-size:clamp(27px,6vw,40px);
  font-weight:900;
  margin:2px 0 25px;
  text-shadow:0 0 15px rgba(21,151,255,.4);
}
.section{
  display:block;
  font-size:19px;
  margin:0 0 8px;
}
select{
  width:100%;
  height:55px;
  background:#030507;
  color:#fff;
  border:2px solid #1597ff;
  border-radius:10px;
  padding:0 14px;
  font-size:17px;
  outline:none;
  margin-bottom:16px;
}
.checks{margin-top:6px}
.toggle-row{
  position:relative;
  display:flex;
  align-items:center;
  justify-content:space-between;
  min-height:48px;
  margin:7px 0;
  padding:4px 0;
  color:#fff;
  font-size:20px;
  font-weight:800;
}
.toggle-row input{
  position:absolute;
  opacity:0;
  width:0;
  height:0;
}
.toggle-row i{
  position:relative;
  display:block;
  width:64px;
  height:34px;
  flex:none;
  border-radius:999px;
  background:#4b4d52;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);
  transition:.2s;
}
.toggle-row i::after{
  content:"";
  position:absolute;
  width:28px;
  height:28px;
  top:3px;
  left:3px;
  border-radius:50%;
  background:#fff;
  box-shadow:0 2px 6px rgba(0,0,0,.35);
  transition:.2s;
}
.toggle-row input:checked + i{
  background:#1597ff;
  box-shadow:0 0 12px rgba(21,151,255,.28);
}
.toggle-row input:checked + i::after{
  left:33px;
}
.dpi-head{
  display:flex;
  justify-content:space-between;
  align-items:end;
  margin:17px 4px 7px;
  font-size:19px;
  font-weight:900;
}
#dpiValue{font-size:24px}
input[type=range]{
  width:100%;
  accent-color:#1597ff;
  cursor:pointer;
}
button{
  width:100%;
  height:62px;
  margin-top:25px;
  border:0;
  border-radius:12px;
  background:#1597ff;
  color:#fff;
  font-size:21px;
  font-weight:900;
  box-shadow:0 8px 22px rgba(21,151,255,.25);
  cursor:pointer;
}
button:active{transform:scale(.99)}
.status{
  text-align:center;
  color:#55b5ff;
  font-size:16px;
  margin:14px 0 0;
  min-height:22px;
}
.hint{
  text-align:center;
  font-size:16px;
  font-weight:800;
  margin-top:12px;
  color:#ddd;
}
.modal-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.78);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:22px;
  z-index:9999;
  backdrop-filter:blur(5px);
}
.modal{
  width:min(420px,90vw);
  background:#11161c;
  border:2px solid #1597ff;
  border-radius:18px;
  padding:25px 22px 22px;
  text-align:center;
  box-shadow:0 0 35px rgba(21,151,255,.3);
}
.modal h2{margin:0 0 10px;color:#1597ff;font-size:28px}
.modal p{margin:8px 0 17px;color:#e9eef4;font-size:17px;line-height:1.5}
.modal button{height:55px;margin-top:6px;font-size:19px}
@media(max-width:600px){
  .panel{left:50%;top:50%;transform:translate(-50%,-50%);width:88vw}
}

.password-modal{position:fixed;inset:0;background:rgba(0,0,0,.86);display:flex;align-items:center;justify-content:center;padding:20px;z-index:10000;backdrop-filter:blur(7px)}
.password-box{width:min(420px,92vw);background:#11161c;border:2px solid #1597ff;border-radius:20px;padding:28px 24px;text-align:center;box-shadow:0 0 38px rgba(21,151,255,.32)}
.password-box h2{margin:0 0 10px;color:#1597ff;font-size:28px}
.password-box p{margin:8px 0 18px;color:#dce6ef;font-size:16px}
.password-box input{width:100%;height:54px;background:#05070a;color:#fff;border:2px solid #1597ff;border-radius:10px;padding:0 14px;font-size:18px;outline:none}
.password-box button{height:56px;margin-top:16px}
.password-error{height:24px;margin-top:10px;color:#ff5d6c;font-size:15px}
</style>
</head>
<body>


<div class="password-modal" id="passwordModal">
  <div class="password-box">
    <h2>🔐 ปลดล็อกเว็บไซต์</h2>
    <p>กรุณาใส่รหัสเพื่อเข้าสู่ TawanEiEi King V3👑</p>
    <input id="passwordInput" type="password" placeholder="ใส่รหัสผ่าน" autocomplete="off">
    <button id="unlockBtn">🔓 ปลดล็อก</button>
    <div class="password-error" id="passwordError"></div>
  </div>
</div>
<div class="modal-overlay" id="welcomeModal">
  <div class="modal">
    <h2>TawanEiEi King V3👑</h2>
    <p>ยินดีต้อนรับ 👋<br>กดปุ่มด้านล่างเพื่อเข้าสู่หน้าตั้งค่า</p>
    <button id="startBtn">✓ เริ่มใช้งาน</button>
  </div>
</div>
<main class="panel">
  <h1 class="title">TawanEiEi King V3👑</h1>

  <label class="section" for="quality">ระดับความคม</label>
  <select id="quality">
    <option>สูง</option>
    <option>กลาง</option>
    <option>ต่ำ</option>
  </select>

  <label class="section" for="device">เลือกมือถือ</label>
  <select id="device">
    <option>Android</option>
    <option>iPhone</option>
    
  </select>

  <div class="checks">
    <label class="toggle-row"><span>ดูหัว 98%</span><input type="checkbox" checked><i></i></label>
    <label class="toggle-row"><span>ช่วยลาก 67%</span><input type="checkbox" checked><i></i></label>
    <label class="toggle-row"><span>จอลื่น 70%</span><input type="checkbox"><i></i></label>
    <label class="toggle-row"><span>แก้ค้าง 100%</span><input type="checkbox" checked><i></i></label>
    <label class="toggle-row"><span>กันแบนกันติดดำ</span><input type="checkbox"><i></i></label>
  </div>

  <div class="dpi-head">
    <span>DPI (100 – 1000)</span>
    <span id="dpiValue">200</span>
  </div>
  <input id="dpi" type="range" min="100" max="1000" value="200">

  <button id="apply">✓ ยืนยันตั้งค่า</button>
  <div class="status" id="status"></div>
  <div class="hint">กดยืนยันแล้วก็มาเลย</div>
</main>

<script>

const passwordModal=document.getElementById('passwordModal');
const passwordInput=document.getElementById('passwordInput');
const passwordError=document.getElementById('passwordError');
const unlockBtn=document.getElementById('unlockBtn');
const SITE_PASSWORD='TawanEiEi.GG⁶⁷';

function unlockSite(){
  if(passwordInput.value===SITE_PASSWORD){
    passwordModal.style.display='none';
    passwordError.textContent='';
    passwordInput.value='';
  }else{
    passwordError.textContent='รหัสไม่ถูกต้อง กรุณาลองใหม่';
    passwordInput.select();
  }
}
unlockBtn.addEventListener('click',unlockSite);
passwordInput.addEventListener('keydown',e=>{
  if(e.key==='Enter') unlockSite();
});

const welcomeModal=document.getElementById('welcomeModal');
document.getElementById('startBtn').addEventListener('click',()=>{
  welcomeModal.style.display='none';
});

const dpi=document.getElementById('dpi');
const dpiValue=document.getElementById('dpiValue');
const status=document.getElementById('status');

dpi.addEventListener('input',()=>dpiValue.textContent=dpi.value);

document.getElementById('apply').addEventListener('click',()=>{
  status.textContent='✓ ตั้งค่าเสร็จแล้ว กำลังเปิดเกม...';

  // บันทึกค่าที่เลือกไว้ในเครื่อง
  localStorage.setItem('tawanDPI', dpi.value);
  localStorage.setItem('tawanQuality', document.getElementById('quality').value);
  localStorage.setItem('tawanDevice', document.getElementById('device').value);

  // พยายามเปิด Free Fire บน Android
  setTimeout(()=>{
    window.location.href='freefire://';
  },700);

  // ถ้าไม่มีแอปที่รองรับลิงก์นี้
  setTimeout(()=>{
    status.textContent='เปิดเกมไม่สำเร็จ กรุณาเปิด Free Fire เอง';
  },2500);
});
</script>
</body>
</html>
